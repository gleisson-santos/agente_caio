
services:

  ## --------------------------- CAIO CORP --------------------------- ##

  caio-dashboard:
    image: caiocorp/caio-dashboard:latest ## Dashboard React + Nginx

    networks:
      - ControllNet ## Nome da rede interna

    ports:
      - "8080:80"

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.caio-dashboard.rule=Host(`${DOMAIN:-localhost}`)
        - traefik.http.routers.caio-dashboard.entrypoints=websecure
        - traefik.http.routers.caio-dashboard.tls.certresolver=letsencryptresolver
        - traefik.http.services.caio-dashboard.loadbalancer.server.port=80

  ## --------------------------- CAIO CORP --------------------------- ##

  caio-agent:
    image: caiocorp/caio-agent:latest ## Core do Agente IA
    command: [ "gateway" ] ## Inicia o bot Telegram (override do CMD status)

    volumes:
      - caio_workspace:/root/.caiocore/workspace ## Workspace do agente
      - /root/agente_caio/config.json:/root/.caiocore/config.json ## Config principal do CaioCore

    networks:
      - ControllNet ## Nome da rede interna

    ports:
      - "18795:18795"

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.http.routers.caio-agent.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/events`))
        - traefik.http.routers.caio-agent.entrypoints=websecure
        - traefik.http.routers.caio-agent.tls.certresolver=letsencryptresolver
        - traefik.http.services.caio-agent.loadbalancer.server.port=18795

## --------------------------- CAIO CORP --------------------------- ##

volumes:
  caio_workspace:
    external: true
    name: caio_workspace

networks:
  ControllNet:
    external: true
    name: ControllNet
