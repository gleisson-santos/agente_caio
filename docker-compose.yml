

services:

  ## --------------------------- CAIO CORP --------------------------- ##

  caio-dashboard:
    image: caiocorp/caio-dashboard:latest ## Dashboard React + Nginx

    networks:
      - ControllNet ## Nome da rede interna

    ports:
      - "8080:80"

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.caio-dashboard.rule=Host(`${DOMAIN:-localhost}`) || PathPrefix(`/`)
        - traefik.http.routers.caio-dashboard.entrypoints=web,websecure
        - traefik.http.routers.caio-dashboard.priority=1
        - traefik.http.routers.caio-dashboard.tls.certresolver=letsencryptresolver
        - traefik.http.services.caio-dashboard.loadbalancer.server.port=80
        - traefik.http.services.caio-dashboard.loadbalancer.passHostHeader=true

  ## --------------------------- CAIO CORP --------------------------- ##

  caio-agent:
    image: caiocorp/caio-agent:latest ## Core do Agente IA
    command: [ "gateway" ] ## Inicia o bot Telegram (override do CMD status)

    volumes:
      - caio_workspace:/root/.caiocore/workspace ## Workspace do agente
      - /root/agente_caio/config.json:/root/.caiocore/config.json ## Config principal do CaioCore
      - /root/agente_caio/caio-stack:/app/caio-stack ## Credenciais (Google Calendar, etc)

    networks:
      - ControllNet ## Nome da rede interna

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BRAVE_API_KEY=${BRAVE_API_KEY}

    ports:
      - "18790:18790"

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.caio-agent.rule=(Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/events`))) || (PathPrefix(`/api`) || PathPrefix(`/events`))
        - traefik.http.routers.caio-agent.entrypoints=web,websecure
        - traefik.http.routers.caio-agent.priority=2
        - traefik.http.routers.caio-agent.tls.certresolver=letsencryptresolver
        - traefik.http.services.caio-agent.loadbalancer.server.port=18790

## --------------------------- CAIO CORP --------------------------- ##

volumes:
  caio_workspace:
    external: true
    name: caio_workspace

networks:
  ControllNet:
    driver: bridge
